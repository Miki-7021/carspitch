name: scan-pepites

# Toutes les deux heures, décalé de 17 minutes : les crons planifiés à l'heure
# pile sont souvent retardés ou ignorés par GitHub.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scan-pepites
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Mémoire des annonces déjà vues : un cache reconstruit à chaque passage.
      - name: Restaurer la mémoire des annonces vues
        uses: actions/cache/restore@v4
        with:
          path: scanner/seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      # Le runner ne joint pas api.telegram.org : les envois passent par
      # Supabase (fonction « pepite »), qui relaie vers Telegram.
      - name: Scanner les annonces
        env:
          PEPITE_URL: ${{ secrets.PEPITE_URL }}
          PEPITE_SECRET: ${{ secrets.PEPITE_SECRET }}
          ALERT_MATCH_URL: ${{ secrets.ALERT_MATCH_URL }}
          WATCH_LIST_URL: ${{ secrets.WATCH_LIST_URL }}
          WATCH_SECRET: ${{ secrets.WATCH_SECRET }}
          MATCH_SECRET: ${{ secrets.MATCH_SECRET }}
        run: node scanner/scan.ts

      - name: Enregistrer la mémoire des annonces vues
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scanner/seen.json
          key: seen-${{ github.run_id }}
